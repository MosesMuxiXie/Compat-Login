pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'compat_login'

// Each module is named after the highest Minecraft release its JAR supports.
include 'versions:1.21.11'
include 'versions:26.2'
