# Done to increase the memory available to gradle.
# file.encoding=COMPAT keeps the daemon on the platform charset, so the @argfile Gradle writes for
# test workers stays readable when the project path contains non-ASCII characters.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=COMPAT
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.3
loom_version=1.17.20

# Obfuscated mapping line, built by versions/1.21.11.
# Compiled against the oldest supported release so one JAR covers the whole range.
legacy_compile_version=1.16.5
legacy_lowest_version=1.16
legacy_java_dependency=>=8

# Unobfuscated mapping line, built by versions/26.2.
# Loader 26.x runs without runtime mappings, so this line needs its own artifact.
modern_lowest_version=26.1
modern_java_dependency=>=25

# Mod Properties
version=1.1.0
group=cn.compatlogin
