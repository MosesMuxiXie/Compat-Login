plugins {
	id 'base'
	// Declared here without applying so both version modules can pick the matching Loom flavour.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def releaseModules = [':versions:1.21.11', ':versions:26.2']
def releaseJarVersion = project.version.toString()

// The module libs directories can still hold JARs of earlier mod versions, so only this build's
// version is collected; otherwise stale artifacts fail the release count check below.
// Archive names follow gradle/version-module.gradle: "<root project name>-<module name>-<version>".
def expectedReleaseJars = releaseModules.collect { path ->
	"${rootProject.name}-${project(path).name}-${releaseJarVersion}.jar"
}.sort()

def collectReleaseJars = tasks.register('collectReleaseJars', Sync) {
	group = 'build'
	description = 'Collects one release JAR per supported Minecraft line into build/libs.'

	from(releaseModules.collect { path -> project(path).layout.buildDirectory.dir('libs') }) {
		include "compat_login-*-${releaseJarVersion}.jar"
	}
	into layout.buildDirectory.dir('libs')

	dependsOn releaseModules.collect { path -> "${path}:build" }

	doLast {
		def jars = fileTree(destinationDir).matching { include '*.jar' }.files.collect { it.name }.sort()
		if (jars != expectedReleaseJars) {
			throw new GradleException("Expected ${expectedReleaseJars} but collected ${jars}")
		}
		jars.each { jar -> logger.lifecycle("Release artifact: ${jar}") }
	}
}

tasks.register('buildAllVersions') {
	group = 'build'
	description = 'Builds every supported Minecraft release artifact.'
	dependsOn collectReleaseJars
}

tasks.named('build') {
	dependsOn collectReleaseJars
}

tasks.named('clean') {
	dependsOn releaseModules.collect { path -> "${path}:clean" }
}
