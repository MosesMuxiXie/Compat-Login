name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          # The 26.x line targets Java 25 bytecode, the 1.21.11 line targets Java 8.
          java-version: '25'
          distribution: microsoft
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build release artifacts
        run: bash ./gradlew build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}'
          build/libs/compat_login-1.21.11-*.jar
          build/libs/compat_login-26.2-*.jar
          --generate-notes
          --title 'Compat Login ${{ github.ref_name }}'
