name: build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test universal JAR
        run: bash ./gradlew build
      - name: Upload universal JAR
        uses: actions/upload-artifact@v7
        with:
          name: compat-login-universal
          path: |
            build/libs/compat_login-universal-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - minecraft: '1.16.5'
            java: '8'
          - minecraft: '1.17.1'
            java: '17'
          - minecraft: '1.18.2'
            java: '17'
          - minecraft: '1.19.2'
            java: '17'
          - minecraft: '1.19.4'
            java: '17'
          - minecraft: '1.20.1'
            java: '17'
          - minecraft: '1.20.4'
            java: '17'
          - minecraft: '1.20.6'
            java: '21'
          - minecraft: '1.21.1'
            java: '21'
          - minecraft: '1.21.4'
            java: '21'
          - minecraft: '1.21.8'
            java: '21'
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '26.1.2'
            java: '25'
          - minecraft: '26.2'
            java: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Download universal JAR
        uses: actions/download-artifact@v8
        with:
          name: compat-login-universal
          path: build/libs
      - name: Smoke test Minecraft ${{ matrix.minecraft }}
        run: bash ./scripts/smoke-test-server.sh '${{ matrix.minecraft }}' '0.19.3' '1.1.2'
